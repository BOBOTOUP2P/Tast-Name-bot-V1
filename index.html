<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram User Profile</title>
    <!-- ភ្ជាប់ Telegram Script ដើម -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .avatar {
            width: 80px;
            height: 80px;
            background-color: #0088cc;
            color: white;
            font-size: 32px;
            font-weight: bold;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px auto;
            box-shadow: 0 4px 10px rgba(0, 136, 204, 0.3);
        }

        h2 {
            color: #222222;
            font-size: 22px;
            margin-bottom: 4px;
        }

        p.username {
            color: #0088cc;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        /* ស្ទីលសម្រាប់បង្ហាញ ID */
        .user-id {
            background-color: #eef2f5;
            color: #555555;
            font-size: 13px;
            font-weight: 600;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .welcome-box {
            background-color: #f0f8ff;
            border: 1px solid #d0e7ff;
            border-radius: 12px;
            padding: 15px;
            color: #333;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar" id="avatar-letter">?</div>
        <h2 id="user-name">កំពុងទាញយកឈ្មោះ...</h2>
        <p class="username" id="user-handle">@username</p>
        
        <!-- កន្លែងបង្ហាញ ID -->
        <div class="user-id" id="user-id">ID: -------</div>

        <div class="welcome-box">
            សូមស្វាគមន៍មកកាន់ប្រព័ន្ធរបស់យើង! ឈ្មោះ និង ID របស់អ្នកត្រូវបានទាញយកដោយស្វ័យប្រវត្តិ។
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe?.user;

        if (user) {
            const fullName = `${user.first_name} ${user.last_name || ''}`.trim();
            
            // ១. បង្ហាញឈ្មោះ
            document.getElementById('user-name').innerText = fullName;
            
            // ២. បង្ហាញ Username
            if (user.username) {
                document.getElementById('user-handle').innerText = `@${user.username}`;
            } else {
                document.getElementById('user-handle').style.display = 'none';
            }

            // ៣. បង្ហាញ Telegram ID (ប្រើ user.id)
            document.getElementById('user-id').innerText = `ID: ${user.id}`;

            // ៤. បង្ហាញអក្សរដំបូង
            document.getElementById('avatar-letter').innerText = user.first_name.charAt(0).toUpperCase();

        } else {
            document.getElementById('user-name').innerText = "សូមបើកតាម Telegram Bot!";
            document.getElementById('user-handle').innerText = "@not_found";
            document.getElementById('user-id').innerText = "ID: Unknown";
        }
    </script>
</body>
</html>
